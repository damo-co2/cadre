name: Build packages

# Builds Cadre for Mac (Apple silicon .dmg + .zip), Windows (x64 installer .exe) and
# Linux (x64 .AppImage + .deb).
# Every run uploads the packages as workflow artifacts; pushing a tag like v0.2.0 also
# attaches them to a GitHub release for that tag.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Mac (Apple silicon)
            os: macos-15
            script: dist:mac
            artifact: cadre-mac-arm64
            files: |
              apps/desktop/release/*.dmg
              apps/desktop/release/*.zip
          - name: Linux (x64)
            os: ubuntu-24.04
            script: dist:linux
            artifact: cadre-linux-x64
            files: |
              apps/desktop/release/*.AppImage
              apps/desktop/release/*.deb
          - name: Windows (x64)
            os: windows-2025
            script: dist:win
            artifact: cadre-windows-x64
            files: |
              apps/desktop/release/*.exe
    env:
      # The app isn't code-signed yet: don't look for a signing identity in the keychain.
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Also downloads the Electron binary for this OS (electron-builder packages that one).
      - name: Install dependencies
        run: npm ci

      # Builds the shared packages (the app bundles them from their dist folders).
      - name: Typecheck and build packages
        run: npm run typecheck

      - name: Build ${{ matrix.name }} packages
        # Run in the workspace so --publish never reaches electron-builder (not npm).
        run: npm run ${{ matrix.script }} --workspace=apps/desktop -- --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error
          retention-days: 14

  release:
    name: Attach to release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: packages
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: packages/*
          fail_on_unmatched_files: true
